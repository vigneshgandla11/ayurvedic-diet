<!DOCTYPE html>
<html>
<head>
<title>Diet Result</title>
<style>
body{font-family:Arial;background:linear-gradient(to right,#d4fc79,#96e6a1);}
.container{background:white;padding:20px;margin:auto;width:80%;border-radius:15px;}
.card{display:inline-block;background:#f0fff0;padding:10px;margin:10px;border-radius:10px;width:150px;text-align:center;}
.card img{width:120px;height:100px;border-radius:10px;}
</style>
</head>
<body>
<div class="container">
<h2>Hello {{name}} 🌿</h2>
<h3>BMI: {{bmi}} ({{bmi_status}})</h3>
<h3>Recommended Foods</h3>
{% for food in foods %}
<div class="card">
<p>{{food}}</p>
<img src="{{ url_for('static', filename='images/' + food_images[food]) }}" width="120" height="100">
</div>
{% endfor %}
<h3>Foods to Avoid❌</h3>
<ul>
{% for food in avoid %}
<li>{{food}}</li>
{% endfor %}
</ul>
</div>
</body>
</html>
